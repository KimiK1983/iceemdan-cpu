[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iceemdan-cpu"
version = "2.0.0"
description = "CPU ICEEMDAN decomposition with explicit IMF and residue contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy", "scipy"]

[tool.setuptools]
py-modules = ["ICEEMDAN"]
